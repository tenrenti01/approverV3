  /* ---------- the phone's own QR reader ----------
     Chrome and Brave on Android can read a QR straight from the camera with
     nothing downloaded. We try that first: it starts faster and still works on
     an office network that blocks outside downloads. If the phone has no such
     reader (iPhone/Safari), we fall back to the downloaded helper, and if that
     cannot be fetched either, to taking a photo — which always works. */
  function scNativeSupported(){
    return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && ('BarcodeDetector' in window));
  }
  function scNativeLive(onFail){
    if(!scNativeSupported()) return onFail('nonative');
    var det;
    try { det = new window.BarcodeDetector({ formats:['qr_code'] }); }
    catch(e){ return onFail('nonative'); }

    navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal:'environment' } }, audio:false })
      .then(function(stream){
        if(PT.screen!=='scan'){ try{ stream.getTracks().forEach(function(t){t.stop();}); }catch(e){} return; }
        SC.stream=stream; SC.mode='native'; SC.live=true; SC.why=''; viewScanner();
        var v=$('scVid');
        if(!v){ try{ stream.getTracks().forEach(function(t){t.stop();}); }catch(e){} SC.stream=null; return onFail('noview'); }
        v.srcObject=stream; v.setAttribute('playsinline',''); v.muted=true;
        var play=v.play(); if(play && play['catch']) play['catch'](function(){});
        if(SC.loop) clearInterval(SC.loop);
        SC.loop=setInterval(function(){
          if(PT.screen!=='scan' || SC.busy || !v.videoWidth) return;
          det.detect(v).then(function(codes){
            if(codes && codes.length && codes[0].rawValue) scDecoded(codes[0].rawValue);
          })['catch'](function(){});
        }, 220);                                    // about 4 looks a second: plenty, and easy on the battery
      })
      ['catch'](function(err){
        var n=(err && err.name) || '';
        onFail(n==='NotAllowedError' ? 'denied'
             : n==='NotFoundError'   ? 'nocam'
             : n==='NotReadableError'? 'busy' : 'nocam');
      });
  }

  /* live camera is an upgrade; the photo button always works */
  function scTryLive(){
    /* 1st choice: the phone's built-in reader, nothing to download */
    if(scNativeSupported()){ scNativeLive(function(why){ SC.why=why; scTryLibLive(why); }); return; }
    scTryLibLive('nonative');
  }
  function scTryLibLive(why){
    if(why==='denied'){ SC.live=false; SC.camBlocked=true; SC.why='denied'; if(PT.screen==='scan') viewScanner(); return; }
    loadQrLib(function(ok){
      if(!ok || PT.screen!=='scan'){
        SC.camBlocked=!ok;
        /* Keep the first, more specific reason. "The camera is in use" is more
           use to the attendant than "the helper could not be downloaded". */
        var specific = (SC.why==='denied'||SC.why==='busy'||SC.why==='nocam');
        if(!ok && !specific) SC.why='nolib';
        if(!ok && PT.screen==='scan') viewScanner();
        return;
      }
      SC.live=true; SC.mode='lib'; viewScanner();
      var settled=false;
      function toPhoto(){ if(settled) return; settled=true; clearTimeout(giveUp); scStopLive(); SC.live=false; SC.camBlocked=true; if(PT.screen==='scan' && !SC.busy) viewScanner(); }
      var giveUp=setTimeout(toPhoto, 4000);
      try{
        SC.scanner=new Html5Qrcode('reader', false);
        SC.scanner.start({facingMode:'environment'},
          {fps:10,qrbox:function(w,h){ var s=Math.floor(Math.min(w,h)*.72); return {width:s,height:s}; }},
          function(t){ scDecoded(t); }, function(){}
        ).then(function(){ if(settled){ try{ SC.scanner.stop(); }catch(e){} return; } settled=true; clearTimeout(giveUp); })['catch'](toPhoto);
      }catch(e){ toPhoto(); }
    });
  }
  function scDecoded(t){
    if(SC.busy) return;
    var n=Date.now(); if(t===SC.lastCode && n-SC.lastAt<2500) return;
    SC.lastCode=t; SC.lastAt=n; scCheck(t);
  }
  function scDecodeFile(file){
    return new Promise(function(res,rej){
      if(!('BarcodeDetector' in window)) return rej('unsupported');
      try{ var d=new window.BarcodeDetector({formats:['qr_code']});
        createImageBitmap(file).then(function(b){ d.detect(b).then(function(c){ (c&&c.length&&c[0].rawValue)?res(c[0].rawValue):rej('none'); })['catch'](rej); })['catch'](rej);
      }catch(e){ rej(e); }
    })['catch'](function(){
      return new Promise(function(res,rej){
        loadQrLib(function(ok){
          if(!ok) return rej('no-lib');
          try{
            if(!$('filereader')){ var d=document.createElement('div'); d.id='filereader'; d.style.display='none'; document.body.appendChild(d); }
            if(!SC.fileScanner) SC.fileScanner=new Html5Qrcode('filereader', false);
            SC.fileScanner.scanFile(file,false).then(res)['catch'](rej);
          }catch(e){ rej(e); }
        });
      });
    });
  }
  var picker=document.createElement('input');
  picker.type='file'; picker.accept='image/*'; picker.setAttribute('capture','environment'); picker.hidden=true;
  document.body.appendChild(picker);
  picker.onchange=function(e){
    var f=e.target.files&&e.target.files[0]; e.target.value=''; if(!f) return;
    scWorking('Reading the QR code…','Hold on while the photo is checked.');
    scStopLive().then(function(){ return scDecodeFile(f); })
      .then(function(t){ scCheck(t); })
      ['catch'](function(){ SC.live=false; SC.tab='scan'; viewScanner({photoFail:true}); });
  };
  function scWorking(t,m){
    PT.screen='scanwork';
    scPage('<div class="sc-card"><div class="sc-loader"><div class="sc-ring"></div><h2>'+escq(t)+'</h2><p>'+m+'</p></div></div>','');
  }

  /* ---------- 2. verdict ---------- */
  var SC_STYLE={
    ready:       {cls:'ok',  icon:'check', label:'APPROVED',     sub:'Ready to release'},
    used:        {cls:'warn',icon:'alert', label:'ALREADY USED', sub:'Do not release again'},
    voided:      {cls:'bad', icon:'ban',   label:'CANCELLED',    sub:'This slip was voided'},
    not_approved:{cls:'bad', icon:'x',     label:'NOT APPROVED', sub:'Approvals are not complete'},
    not_found:   {cls:'bad', icon:'search',label:'NOT FOUND',    sub:'No matching slip'}
  };
  function scCheck(text){
    text=String(text||'').trim(); if(!text) return;
    SC.busy=true; scStopLive();
    scWorking('Checking the slip…','Looking up '+(/^https?:/i.test(text)?'the slip link':'<b>'+escq(text.toUpperCase())+'</b>')+' in the records.');
    google.script.run
      .withSuccessHandler(function(r){ if(sessionLost(r)) return; scResult(r||{state:'not_found',message:'No answer from the server.'}); })
      .withFailureHandler(function(e){ scResult({state:'not_found',message:'Could not reach the records: '+failMsg(e)}); })
      .scanCheck(PT.token, text);
  }
  function scBeep(ok){
    try{ var C=window.AudioContext||window.webkitAudioContext; if(!C) return; SC.ac=SC.ac||new C();
      var o=SC.ac.createOscillator(), g=SC.ac.createGain(); o.type='sine'; o.frequency.value=ok?880:220; g.gain.value=.12;
      o.connect(g); g.connect(SC.ac.destination); o.start(); o.stop(SC.ac.currentTime+(ok?.15:.4)); }catch(e){}
  }
  function scResult(r){
    PT.screen='scanres'; SC.cur=r; SC.busy=false;
    var st=SC_STYLE[r.state]||SC_STYLE.not_found;
    scBeep(r.state==='ready');
    try{ if(navigator.vibrate) navigator.vibrate(r.state==='ready'?80:[60,60,60]); }catch(e){}
    setHeader('Fuel Release', st.label+' · '+(r.code||''));
    var items=(r.items||[]).length?'<ul class="sc-items">'+r.items.map(function(it){ return '<li><span>'+escq(it.d)+'</span><b>'+escq(it.q)+(it.q?' L':'')+'</b></li>'; }).join('')+'</ul>':'';
    var dl=(r.fields||[]).length?'<div class="sc-card"><div class="sc-h">'+sci('file')+'Slip details</div><div class="sc-dl">'+
      r.fields.map(function(f){ return '<span>'+escq(f[0])+'</span><b>'+escq(f[1])+'</b>'; }).join('')+
      (r.releasedOn?'<span>Released on</span><b>'+escq(r.releasedOn)+'</b>':'')+(r.releasedBy?'<span>Released by</span><b>'+escq(r.releasedBy)+'</b>':'')+
      '</div></div>':'';
    var fuel=(r.totalQty||items)?'<div class="sc-card"><div class="sc-h">'+sci('drop')+(r.state==='ready'?'Fuel to release':'Fuel on this slip')+(r.requester?' · '+escq(r.requester):'')+'</div>'+
      (r.totalQty?'<div class="sc-qty"><b>'+escq(r.totalQty)+'</b><span>Liters total</span></div>':'')+items+'</div>':'';
    scPage(
      '<div class="sc-verdict '+st.cls+'"><div class="sc-badge">'+sci(st.icon)+'</div><div><h2>'+st.label+'</h2><p>'+escq(r.message||st.sub)+'</p>'+
        (r.code?'<div class="cd">'+escq(r.code)+'</div>':'')+'</div></div>'+
      '<div class="sc-grid" style="margin-top:2px"><div class="sc-col">'+fuel+'</div><div class="sc-col">'+dl+'</div></div>',
      r.state==='ready'
        ? '<button class="sc-btn navy" id="scBack" style="flex:0 0 34%">Cancel</button><button class="sc-btn" id="scRel">'+sci('drop')+'Release fuel</button>'
        : '<button class="sc-btn navy full" id="scBack">'+sci('qr')+'Scan another</button>');
    $('scBack').onclick=function(){ scAgain(); };
    if($('scRel')) $('scRel').onclick=function(){ scReleaseSheet(r); };
  }
  function scAgain(){ cancelAutoHome();
    var go=function(){ SC.live=false; viewScanner(); if(!SC.camBlocked) scTryLive(); };
    var p=scStopLive();                              // let the camera go first, or the next start finds it busy
    if(p && p.then) p.then(go)['catch'](go); else go();
  }

  /* ---------- 3. release (PIN only when it has gone stale) ---------- */
  function scReleaseSheet(r){
    var askPin=!pinFresh();
    var m=document.createElement('div'); m.className='sheet';
    m.innerHTML='<div class="sheet-in"><h3>Release '+escq(r.totalQty||'')+(r.totalQty?' L ':'')+'for '+escq(r.code)+'?</h3>'+
      '<p>Only tap Release after the fuel is handed over. This marks the slip <b>COMPLETED</b> and emails the requester.'+(askPin?' Type your PIN to confirm.':'')+'</p>'+
      (askPin?'<input id="rlPin" class="pininput" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN">':'')+
      '<div class="msg err" id="rlErr" hidden></div>'+
      '<div class="sheet-btns"><button class="btn sec" id="rlC">Cancel</button><button class="btn go" id="rlS">Yes, release</button></div></div>';
    document.body.appendChild(m);
    void m.offsetWidth; requestAnimationFrame(function(){ m.classList.add('on'); });
    setTimeout(function(){ var f=$('rlPin'); if(f) f.focus(); },300);
    function close(){ m.classList.remove('on'); setTimeout(function(){ if(m.parentNode) m.parentNode.removeChild(m); },320); }
    function perr(t){ var e=$('rlErr'); e.textContent=t; e.hidden=false; }
    $('rlC').onclick=close; m.onclick=function(ev){ if(ev.target===m) close(); };
    function go(){
      var pin=askPin?($('rlPin').value||'').trim():PT.pin;
      if(!pin) return perr('Type your PIN.');
      $('rlS').disabled=true; $('rlC').disabled=true; $('rlS').textContent='Releasing…';
      google.script.run
        .withSuccessHandler(function(res){
          if(sessionLost(res)){ close(); return; }
          if(!res||!res.ok){
            $('rlS').disabled=false; $('rlC').disabled=false; $('rlS').textContent='Yes, release';
            if(res&&res.reason==='pin'){ clearPin(); if(askPin){ $('rlPin').value=''; $('rlPin').focus(); return perr(res.message); } close(); return scReleaseSheet(r); }
            close(); return scResult(mixObj(r,{ state:res&&res.state||'not_found', message:(res&&res.message)||'Could not release.' }));
          }
          touchPin(pin); close(); scDone(res);
        })
        .withFailureHandler(function(e){ $('rlS').disabled=false; $('rlC').disabled=false; $('rlS').textContent='Yes, release'; perr(failMsg(e)); })
        .scanRelease(PT.token, r.code, pin);
    }
    $('rlS').onclick=go;
    if($('rlPin')) $('rlPin').onkeydown=function(e){ if(e.key==='Enter') go(); };
  }
  function mixObj(a,b){ var o={},k; for(k in a) o[k]=a[k]; for(k in b) o[k]=b[k]; return o; }

  /* ---------- 4. done ---------- */
  function scDone(res){
    PT.screen='scandone';
    SC.today.unshift({ code:res.code, requester:res.requester, qty:res.totalQty, at:res.releasedOn });
    setHeader('Fuel Release','Completed · '+res.code);
    scPage('<div class="sc-done"><div class="sc-tick"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></div>'+
      '<h2>Fuel released</h2>'+
      '<p><b>'+escq(res.totalQty||'')+(res.totalQty?' L':'')+'</b> for <b>'+escq(res.code)+'</b>'+(res.requester?' · '+escq(res.requester):'')+'<br>'+
      'Released '+escq(res.releasedOn)+' by '+escq(res.releasedBy)+'.</p>'+
      '<div class="sc-chip">✓ SLIP COMPLETED</div>'+
      '<p style="margin-top:12px">'+(res.emailedTo?'The requester was notified by email ('+escq(res.emailedTo)+').':'')+'</p>'+
      (res.warning?'<div class="sc-note warn" style="text-align:left">'+sci('alert')+'<span>'+escq(res.warning)+'</span></div>':'')+
      '</div>',
      '<button class="sc-btn full" id="scNext">'+sci('qr')+'Scan next slip</button>');
    $('scNext').onclick=scAgain;
    autoHome(5,'Next scan',scAgain);
  }
  /* ---------- auto-return: a 5-second countdown with a "Stay here" button ---------- */
  var AH={ timer:null, el:null };
  function cancelAutoHome(){
    if(AH.timer){ clearInterval(AH.timer); AH.timer=null; }
    var el=AH.el; AH.el=null;
    if(el){ el.classList.remove('on'); setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); },400); }
  }
  function autoHome(secs, label, go){
    cancelAutoHome();
    var left=secs, el=document.createElement('div'); el.className='ah'; el.setAttribute('role','status');
    el.innerHTML='<svg viewBox="0 0 24 24"><circle class="bgc" cx="12" cy="12" r="10"/><circle class="fgc" cx="12" cy="12" r="10"/></svg>'+
      '<span>'+label+' in <b>'+left+'</b>…</span><button type="button">Stay here</button>';
    document.body.appendChild(el); AH.el=el;
    void el.offsetWidth; requestAnimationFrame(function(){ el.classList.add('on'); });
    el.querySelector('button').onclick=cancelAutoHome;
    var ring=el.querySelector('.fgc'), num=el.querySelector('b');
    AH.timer=setInterval(function(){
      left--; if(num) num.textContent=Math.max(left,0);
      if(ring) ring.style.strokeDashoffset=String(63*(secs-left)/secs);
      if(left<=0){ cancelAutoHome(); go(); }
    },1000);
  }


  /* ===== boot ===== */
  (function(){ viewPortal(); })();

  }

  /* =====================================================================
   *  GETTING STARTED — the same few lines whether this page came from
   *  Apps Script or from GitHub.
   *
   *    gated      = this screen needs the office passcode
   *    not gated  = a link that was emailed to a driver; it just opens
   * ===================================================================== */
  if(ON_GITHUB){
    window.google = { script: { run: makeRunner(null,null) } };
    document.title = SITE.title;
  }

  var P = ON_GITHUB ? urlParams()
                    : ((BOOT && BOOT.params) || { view:(BOOT && BOOT.view) || 'portal' });
  var PUBLIC_VIEWS = [];
  /* A link emailed to a driver: it opens with no passcode, ever. */
  var PUBLIC_NOW = PUBLIC_VIEWS.indexOf(P.view || 'portal') >= 0;

  function startFailed(msg){
    document.body.innerHTML='<div style="max-width:430px;margin:12vh auto;padding:24px;text-align:center;'+
      'font:400 15px/1.6 system-ui,sans-serif;color:#1d1d1f">'+
      '<h2 style="margin:0 0 10px;font-size:1.3rem">This page could not reach the system</h2>'+
      '<p style="color:#626a78">'+String(msg).replace(/[<>&]/g,'')+'</p>'+
      '<button id="rt" style="margin-top:14px;padding:12px 20px;border:0;border-radius:10px;'+
      'background:#F26522;color:#fff;font-weight:600;cursor:pointer">Try again</button>'+
      '<button id="rc" style="margin-top:14px;margin-left:8px;padding:12px 20px;border:1px solid #D3DAE5;border-radius:10px;'+
      'background:#fff;color:#08295F;font-weight:600;cursor:pointer">Connect again</button></div>';
    var r=document.getElementById('rt'); if(r) r.onclick=function(){ location.reload(); };
    var c=document.getElementById('rc'); if(c) c.onclick=function(){ setApiUrl(''); forgetPass(); location.reload(); };
  }

  /* the passcode and the startup details in one trip */
  /* The two /exec addresses look alike, so check we were handed the right one. */
  function wrongApp(b){ return (b && !(b.data && b.data.positions)) ? 'That address is the Requester app. Paste the Approver /exec address instead.' : ''; }

  function unlock(){
    google.script.run
      .withSuccessHandler(function(res){
        if(res && res.ok && res.boot){
          var w = wrongApp(res.boot);
          if(w){ setApiUrl(''); askConnect(w, start); return; }
          BOOT = res.boot; main(); return;
        }
        forgetPass();
        askConnect((res && res.error) || '', unlock);
      })
      .withFailureHandler(function(e){ startFailed((e && e.message) || 'Could not reach the app.'); })
      .gateBoot(PASS, P, DEVICE);
  }

  /* a public link, served from GitHub: fetch the details, no passcode */
  function openStart(){
    apiCall('boot', [P], function(b){
      if(!b){ startFailed('The app answered, but sent nothing back.'); return; }
      var w = wrongApp(b);
      if(w){ setApiUrl(''); askConnect(w, start); return; }
      BOOT = b; main();
    }, function(e){ startFailed((e && e.message) || 'Could not reach the app.'); });
  }

  /* ---------- getting started ----------
     Nothing is asked twice. Whatever this device already knows is used, and
     the Connect screen only appears when something is genuinely missing. */
  function start(){
    if(ON_GITHUB && !apiUrl()){ askConnect('', start); return; }  // never been connected here
    if(PUBLIC_NOW){ ON_GITHUB ? openStart() : main(); return; }   // a driver's link: straight in
    if(ON_GITHUB){ unlock(); return; }                            // asks only if the passcode is missing or wrong
    if(BOOT && BOOT.gate){ PASS ? unlock() : askConnect('', unlock); return; }
    main();                                                        // Apps Script, no passcode set up
  }
  start();

</script>
</body>
</html>
